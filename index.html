<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunisie Recharge - فضاء التاجر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans pb-12 text-slate-800">

    <!-- شاشة دخول التاجر برقم الهاتف وكلمة المرور -->
    <div id="clientAuthScreen" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full space-y-6">
            <div class="text-center space-y-2">
                <div class="bg-emerald-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-emerald-600 text-2xl font-bold">
                    <i class="fa-solid fa-store"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-900">فضاء التاجر (الحانوت)</h2>
                <p class="text-xs text-slate-500">الرجاء إدخال بيانات الدخول التي أعطاها لك الموزع</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف:</label>
                    <input type="text" id="clientLoginPhone" placeholder="رقم الهاتف..." class="w-full border border-slate-300 p-3 rounded-xl text-sm font-bold bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور:</label>
                    <input type="password" id="clientLoginPassword" placeholder="••••••••" class="w-full border border-slate-300 p-3 rounded-xl text-sm font-bold bg-slate-50">
                </div>
                <button onclick="handleClientLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow-sm transition">دخول إلى الحانوت</button>
            </div>
        </div>
    </div>

    <!-- رأسية واجهة التاجر -->
    <header class="bg-white text-slate-800 shadow-sm border-b border-slate-200">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2 text-emerald-700">
                <i class="fa-solid fa-store"></i> <span id="headerClientName">مرحباً بك</span>
            </h1>
            <div class="flex gap-2">
                <button onclick="logoutClient()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-2 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-2xl space-y-6">

        <!-- بطاقة اختيار المشغل للطلب -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-lg font-black text-slate-900">طلب بطاقات شحن أو رصيد</h2>
            
            <div class="grid grid-cols-3 gap-3">
                <button onclick="selectClientOperator('Ooredoo')" class="bg-red-500 text-white p-3 rounded-xl font-bold text-sm shadow-sm">أوريدو</button>
                <button onclick="selectClientOperator('Telecom')" class="bg-blue-500 text-white p-3 rounded-xl font-bold text-sm shadow-sm">تيليكوم</button>
                <button onclick="selectClientOperator('Orange')" class="bg-orange-500 text-white p-3 rounded-xl font-bold text-sm shadow-sm">أورنج</button>
            </div>

            <!-- المنتجات الخاصة بالمشغل -->
            <div id="clientProductsSection" class="hidden space-y-3 border-t pt-4">
                <h3 id="clientSelectedOperatorTitle" class="font-bold text-slate-700 text-sm"></h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="clientCardsGrid"></div>
            </div>
        </div>

        <!-- سلة الطلبات وزر الإرسال -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800">مجموع الطلبية:</h3>
                <span id="clientCartTotal" class="text-xl font-extrabold text-emerald-600">0.000 د.ت</span>
            </div>
            <button onclick="submitClientOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold shadow-sm transition">إرسال الطلب إلى البائع</button>
        </div>

        <!-- طلباتي السابقة -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <h3 class="font-bold text-slate-800">طلباتي السابقة:</h3>
            <div id="clientOrdersHistory" class="space-y-2">
                <p class="text-slate-400 text-xs text-center py-2">لا توجد طلبات سابقة.</p>
            </div>
        </div>
    </main>

    <!-- السكربت والربط بقاعدة البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYNDYcwlmX5rdnpXyGoHR48g-T6h_oHFk",
            authDomain: "tunisia-recharge-pos.firebaseapp.com",
            projectId: "tunisia-recharge-pos",
            storageBucket: "tunisia-recharge-pos.firebasestorage.app",
            messagingSenderId: "101019163347",
            appId: "1:101019163347:web:29ca8f5597d97821abd226",
            measurementId: "G-F7B9D7FLJ0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.currentClient = JSON.parse(localStorage.getItem('currentClient') || 'null');

        window.checkClientAuth = function() {
            if (window.currentClient) {
                document.getElementById('clientAuthScreen').classList.add('hidden');
                document.getElementById('headerClientName').innerText = window.currentClient.name;
                fetchClientOrders();
            } else {
                document.getElementById('clientAuthScreen').classList.remove('hidden');
            }
        };

        window.handleClientLogin = async function() {
            const phone = document.getElementById('clientLoginPhone').value.trim();
            const password = document.getElementById('clientLoginPassword').value.trim();
            try {
                const q = query(collection(db, "clients"), where("phone", "==", phone), where("password", "==", password));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    let cData;
                    snap.forEach(d => cData = { id: d.id, ...d.data() });
                    window.currentClient = cData;
                    localStorage.setItem('currentClient', JSON.stringify(window.currentClient));
                    window.checkClientAuth();
                } else {
                    alert('رقم الهاتف أو كلمة المرور غير صحيحة.');
                }
            } catch (e) {
                alert('خطأ في الاتصال.');
            }
        };

        window.logoutClient = function() {
            localStorage.removeItem('currentClient');
            window.currentClient = null;
            location.reload();
        };

        // تحديث جميع الأسعار والفئات للمشغلين الثلاثة بالتساوي
        window.tariffs = [
            { id: 'Ooredoo_1', operator: 'Ooredoo', name: '1 د.ت', sell: 1.000 },
            { id: 'Ooredoo_5', operator: 'Ooredoo', name: '5 د.ت', sell: 5.000 },
            { id: 'Ooredoo_10', operator: 'Ooredoo', name: '10 د.ت', sell: 10.000 },
            { id: 'Ooredoo_25', operator: 'Ooredoo', name: '25 د.ت', sell: 25.000 },

            { id: 'Telecom_1', operator: 'Telecom', name: '1 د.ت', sell: 1.000 },
            { id: 'Telecom_5', operator: 'Telecom', name: '5 د.ت', sell: 5.000 },
            { id: 'Telecom_10', operator: 'Telecom', name: '10 د.ت', sell: 10.000 },
            { id: 'Telecom_25', operator: 'Telecom', name: '25 د.ت', sell: 25.000 },

            { id: 'Orange_1', operator: 'Orange', name: '1 د.ت', sell: 1.000 },
            { id: 'Orange_5', operator: 'Orange', name: '5 د.ت', sell: 5.000 },
            { id: 'Orange_10', operator: 'Orange', name: '10 د.ت', sell: 10.000 },
            { id: 'Orange_25', operator: 'Orange', name: '25 د.ت', sell: 25.000 }
        ];
        window.clientCart = {};

        window.selectClientOperator = function(op) {
            document.getElementById('clientProductsSection').classList.remove('hidden');
            document.getElementById('clientSelectedOperatorTitle').innerText = `اختر للطلب: ${op}`;
            let html = '';
            window.tariffs.filter(t => t.operator === op).forEach(t => {
                let qty = window.clientCart[t.id] || 0;
                html += `
                    <div onclick="addClientCardQty('${t.id}')" class="bg-slate-50 border p-3 rounded-xl cursor-pointer hover:shadow transition">
                        <h4 class="font-bold">${t.name}</h4>
                        <p class="text-xs text-slate-500">${t.sell} د.ت</p>
                        <div class="mt-2 text-center bg-white py-1 rounded font-bold" id="client_qty_${t.id}">${qty}</div>
                    </div>
                `;
            });
            document.getElementById('clientCardsGrid').innerHTML = html;
        };

        window.addClientCardQty = (id) => {
            window.clientCart[id] = (window.clientCart[id] || 0) + 1;
            document.getElementById(`client_qty_${id}`).innerText = window.clientCart[id];
            calcClientTotal();
        };

        function calcClientTotal() {
            let total = 0;
            for (let id in window.clientCart) {
                let item = window.tariffs.find(t => t.id === id);
                if (item) total += item.sell * window.clientCart[id];
            }
            document.getElementById('clientCartTotal').innerText = total.toFixed(3) + ' د.ت';
        }

        window.submitClientOrder = async function() {
            if (!window.currentClient) {
                alert('الرجاء تسجيل الدخول أولاً.');
                return;
            }
            let items = [], totalSell = 0, totalBuy = 0;
            for (let id in window.clientCart) {
                if (window.clientCart[id] > 0) {
                    let item = window.tariffs.find(t => t.id === id);
                    items.push({ ...item, qty: window.clientCart[id], buy: item.sell * 0.950 });
                    totalSell += item.sell * window.clientCart[id];
                    totalBuy += (item.sell * 0.950) * window.clientCart[id];
                }
            }
            if (items.length === 0) { 
                alert('اختر منتجاً أولاً.'); 
                return; 
            }

            try {
                await addDoc(collection(db, "orders"), {
                    clientName: window.currentClient.name,
                    clientPhone: window.currentClient.phone,
                    vendeurId: window.currentClient.vendeurId || "",
                    items, 
                    totalSell, 
                    totalBuy, 
                    benefice: totalSell - totalBuy,
                    paymentStatus: 'Crédit', 
                    creditAmount: totalSell,
                    date: new Date().toISOString(), 
                    status: 'قيد الانتظار'
                });
                alert('تم إرسال الطلب بنجاح إلى البائع!');
                window.clientCart = {};
                calcClientTotal();
                document.getElementById('clientProductsSection').classList.add('hidden');
                // إعادة رسم الأعداد في الواجهة لترجع لصفر
                if(window.lastSelectedOp) selectClientOperator(window.lastSelectedOp);
            } catch (e) {
                console.error(e);
                alert('خطأ في إرسال الطلب، تحقق من الاتصال.');
            }
        };

        function fetchClientOrders() {
            if (!window.currentClient) return;
            onSnapshot(collection(db, "orders"), (snap) => {
                let historyHtml = '';
                snap.forEach(d => {
                    let o = d.data();
                    if (o.clientName === window.currentClient.name) {
                        historyHtml += `
                            <div class="bg-slate-50 p-3 rounded-xl border flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-bold text-slate-900">مجموع: ${o.totalSell} د.ت</span>
                                    <p class="text-slate-400 mt-0.5">${new Date(o.date).toLocaleDateString()}</p>
                                </div>
                                <span class="bg-amber-100 text-amber-800 px-2 py-1 rounded font-bold">${o.status}</span>
                            </div>
                        `;
                    }
                });
                document.getElementById('clientOrdersHistory').innerHTML = historyHtml || '<p class="text-slate-400 text-xs text-center py-2">لا توجد طلبات سابقة.</p>';
            });
        }

        window.checkClientAuth();
    </script>
</body>
</html>
